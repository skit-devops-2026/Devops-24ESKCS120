<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durgesh - Board</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-brand">
            <h2>Durgesh</h2>
            <p>Project Management</p>
        </div>
        <nav class="navbar-nav">
            <a href="index.html">Dashboard</a>
            <a href="projects.html">Projects</a>
            <a href="tasks.html">Tasks</a>
            <a href="board.html" class="active">Board</a>
            <a href="team.html">Team</a>
            <a href="settings.html">Settings</a>
        </nav>
        <button class="logout-btn" onclick="alert('Logout is not implemented in this frontend demo.')">Logout</button>
    </header>

    <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>Kanban Board</h1>
                    <p>Visualize tasks by their current status</p>
                </div>
            </div>
            <div class="board-container">
                <!-- Todo Column -->
                <div class="board-column">
                    <div class="board-column-header">
                        <h3>Todo</h3>
                        <span class="board-column-count" id="todoCount">0</span>
                    </div>
                    <div id="todoColumn">
                    </div>
                </div>

                <!-- In Progress Column -->
                <div class="board-column">
                    <div class="board-column-header">
                        <h3>In Progress</h3>
                        <span class="board-column-count" id="progressCount">0</span>
                    </div>
                    <div id="progressColumn">
                    </div>
                </div>

                <!-- Done Column -->
                <div class="board-column">
                    <div class="board-column-header">
                        <h3>Done</h3>
                        <span class="board-column-count" id="doneCount">0</span>
                    </div>
                    <div id="doneColumn">
                    </div>
                </div>
            </div>
        </main>
    <footer class="app-footer">
        <p class="footer-brand">Durgesh</p>
        <p>Project Management SaaS - Frontend demo</p>
        <p class="footer-copy">&copy; 2026 Durgesh. Built with HTML, CSS &amp; JavaScript.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/board.js"></script>
</body>
</html>
