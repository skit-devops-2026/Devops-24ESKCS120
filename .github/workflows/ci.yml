name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # M1 — Repository hygiene
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M3 — Build and test
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Build project
        run: make build
