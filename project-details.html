<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durgesh - Project Details</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="navbar-brand">
            <h2>Durgesh</h2>
            <p>Project Management</p>
        </div>
        <nav class="navbar-nav">
            <a href="index.html">Dashboard</a>
            <a href="projects.html" class="active">Projects</a>
            <a href="tasks.html">Tasks</a>
            <a href="board.html">Board</a>
            <a href="team.html">Team</a>
            <a href="settings.html">Settings</a>
        </nav>
        <button class="logout-btn" onclick="alert('Logout is not implemented in this frontend demo.')">Logout</button>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
            <!-- Project info is loaded here by project-details.js using the URL parameter -->
            <div class="project-detail-header" id="projectHeader">
            </div>

            <!-- Tasks belonging to this project -->
            <div class="card">
                <div class="card-header">
                    <h2>Project Tasks</h2>
                    <button class="btn btn-primary" id="addTaskBtn">+ Add Task</button>
                </div>
                <div id="projectTasks">
                </div>
            </div>
        </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p class="footer-brand">Durgesh</p>
        <p>Project Management SaaS - Frontend demo</p>
        <p class="footer-copy">&copy; 2026 Durgesh. Built with HTML, CSS &amp; JavaScript.</p>
    </footer>

    <!-- Modal for adding a task to this project -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h2>Add New Task</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="taskDesc">Description</label>
                    <textarea id="taskDesc" placeholder="Enter task description"></textarea>
                </div>
                <div class="form-group">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority">
                        <option value="High">High</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskStatus">Status</label>
                    <select id="taskStatus">
                        <option value="Todo" selected>Todo</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskAssignee">Assignee</label>
                    <input type="text" id="taskAssignee" placeholder="Enter assignee name">
                </div>
                <div class="form-group">
                    <label for="taskDueDate">Due Date</label>
                    <input type="date" id="taskDueDate">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelTaskBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/project-details.js"></script>
</body>
</html>
