services:
  # ── TaskFlow Express API (Backend Service) ──────────────────────────────────
  - type: web
    name: taskflow-api-24eskcs120
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: EMAIL_FROM
        value: noreply@taskflow.dev

  # ── TaskFlow React 19 SPA (Frontend Service) ────────────────────────────────
  - type: web
    name: taskflow-ui-24eskcs120
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
