global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels:
          app: 'prometheus'

  # Scrape TaskFlow Express API
  - job_name: 'taskflow-backend'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['backend:5000']
        labels:
          app: 'taskflow'
          environment: 'production'
          tier: 'backend'
