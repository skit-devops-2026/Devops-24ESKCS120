<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durgesh - Project Management SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="root">
        <!-- Fallback/Legacy Static View for CI/CD checks & initial load -->
        <header class="navbar">
            <div class="navbar-brand">
                <h2>Durgesh</h2>
                <p>Project Management</p>
            </div>
            <nav class="navbar-nav">
                <a href="index.html" class="active">Dashboard</a>
                <a href="projects.html">Projects</a>
                <a href="tasks.html">Tasks</a>
                <a href="board.html">Board</a>
                <a href="team.html">Team</a>
                <a href="settings.html">Settings</a>
            </nav>
            <button class="logout-btn">Logout</button>
        </header>

        <main class="main-content">
            <div class="welcome-section">
                <h1>Dashboard</h1>
                <p>Welcome back! Loading React application...</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">&#128196;</div>
                    <div class="stat-number" id="totalProjects">5</div>
                    <div class="stat-label">Total Projects</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">&#128203;</div>
                    <div class="stat-number" id="totalTasks">12</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">&#9989;</div>
                    <div class="stat-number" id="completedTasks">3</div>
                    <div class="stat-label">Completed Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">&#9203;</div>
                    <div class="stat-number" id="pendingTasks">9</div>
                    <div class="stat-label">Pending Tasks</div>
                </div>
            </div>
        </main>
    </div>

    <!-- React SPA Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
