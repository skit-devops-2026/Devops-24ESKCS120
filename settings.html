<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durgesh - Settings</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-light">
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="navbar-brand">
            <h2>Durgesh</h2>
            <p>Project Management</p>
        </div>
        <nav class="navbar-nav">
            <a href="index.html">Dashboard</a>
            <a href="projects.html">Projects</a>
            <a href="tasks.html">Tasks</a>
            <a href="board.html">Board</a>
            <a href="team.html">Team</a>
            <a href="settings.html" class="active">Settings</a>
        </nav>
        <button class="logout-btn" onclick="alert('Logout is not implemented in this frontend demo.')">Logout</button>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>Settings</h1>
                    <p>Manage your profile and preferences</p>
                </div>
            </div>

            <!-- Settings Form -->
            <div class="card settings-form">
                <form id="settingsForm">
                    <div class="form-group">
                        <label for="profileName">Profile Name</label>
                        <input type="text" id="profileName" placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="profileEmail">Email</label>
                        <input type="email" id="profileEmail" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="themeSelect">Theme Preference</label>
                        <select id="themeSelect">
                            <option value="light">Light</option>
                            <option value="dark">Dark</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p class="footer-brand">Durgesh</p>
        <p>Project Management SaaS - Frontend demo</p>
        <p class="footer-copy">&copy; 2026 Durgesh. Built with HTML, CSS &amp; JavaScript.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
