<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Tasks</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="navbar-brand">
            <h2>TaskFlow</h2>
            <p>Project Management</p>
        </div>
        <nav class="navbar-nav">
            <a href="index.html">Dashboard</a>
            <a href="projects.html">Projects</a>
            <a href="tasks.html" class="active">Tasks</a>
            <a href="board.html">Board</a>
            <a href="team.html">Team</a>
            <a href="settings.html">Settings</a>
        </nav>
        <button class="logout-btn" onclick="alert('Logout is not implemented in this frontend demo.')">Logout</button>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>Tasks</h1>
                    <p>Create, edit and manage all your tasks</p>
                </div>
                <button class="btn btn-primary" id="addTaskBtn">+ Add Task</button>
            </div>

            <!-- Search and filter toolbar -->
            <div class="toolbar">
                <input type="text" id="taskSearch" placeholder="Search tasks...">
                <select id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="Todo">Todo</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Done">Done</option>
                </select>
                <select id="priorityFilter">
                    <option value="">All Priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <!-- Task table is rendered here by tasks.js -->
            <div id="taskListContainer">
            </div>
        </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p class="footer-brand">TaskFlow</p>
        <p>Project Management SaaS - Frontend demo</p>
        <p class="footer-copy">&copy; 2026 TaskFlow. Built with HTML, CSS &amp; JavaScript.</p>
    </footer>

    <!-- Modal for adding/editing a task -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h2 id="taskModalTitle">Add New Task</h2>
            <form id="taskForm">
                <input type="hidden" id="editingTaskId">
                <div class="form-group">
                    <label for="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="taskDesc">Description</label>
                    <textarea id="taskDesc" placeholder="Enter task description"></textarea>
                </div>
                <div class="form-group">
                    <label for="taskProject">Project</label>
                    <select id="taskProject">
                        <!-- Projects are loaded here by tasks.js -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority">
                        <option value="High">High</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskStatus">Status</label>
                    <select id="taskStatus">
                        <option value="Todo" selected>Todo</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskAssignee">Assignee</label>
                    <input type="text" id="taskAssignee" placeholder="Enter assignee name">
                </div>
                <div class="form-group">
                    <label for="taskDueDate">Due Date</label>
                    <input type="date" id="taskDueDate">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelTaskBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
