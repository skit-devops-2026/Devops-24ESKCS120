apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-mongodb
  labels:
    app: taskflow
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      tier: database
  template:
    metadata:
      labels:
        app: taskflow
        tier: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7-jammy
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_DATABASE
              value: "taskflow"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  labels:
    app: taskflow
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      tier: backend
  template:
    metadata:
      labels:
        app: taskflow
        tier: backend
    spec:
      containers:
        - name: backend
          image: durgesharma1208/taskflow-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: "mongodb://taskflow-mongodb:27017/taskflow"
            - name: CLIENT_URL
              value: "*"
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: jwt-access-secret
                  optional: true
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: jwt-refresh-secret
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-frontend
  labels:
    app: taskflow
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      tier: frontend
  template:
    metadata:
      labels:
        app: taskflow
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: durgesharma1208/taskflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
